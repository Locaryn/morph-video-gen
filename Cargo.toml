[package]
name = "locaryn-plugin-video-gen"
version = "1.1.0"
edition = "2021"
description = "Official Locaryn Extension: Text-to-Video & Image-to-Video Generation (AnimateDiff, CogVideoX, SVD)"
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "locaryn-video-gen-mcp"
path = "src/bin/video_gen_mcp.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
walkdir = "2"

[workspace]
